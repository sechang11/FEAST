name: build-libfeast

# Builds libfeast on every platform the desktop app ships on, then runs the
# Python binding tests and the headless GUI check against it.
#
# The library building is not the interesting part -- a green .dylib does not
# prove the ctypes layer can find and load it, and that is exactly where the
# platform-specific bugs live (AMD64 vs x86_64 arch tags, DLL search paths,
# process spawning, stdio inheritance).
#
# macOS needs two runners: macos-14 is Apple Silicon, macos-15-intel is Intel.
# NOT macos-13 -- that image was retired and jobs asking for it queue forever
# instead of failing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: linux-x64
          - name: macos-arm64
            os: macos-14
            arch: macos-arm64
          - name: macos-x64
            os: macos-15-intel
            arch: macos-x64
          - name: windows-x64
            os: windows-latest
            arch: windows-x64

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- native
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev
          # Qt needs these even with the offscreen platform plugin.
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          # OpenBLAS, not Accelerate: Accelerate's LAPACK makes FEAST's
          # non-Hermitian routines return info=-3. See build/build-feast.sh.
          brew install gcc openblas
          # Homebrew ships versioned binaries (gfortran-14) and no plain
          # `gfortran`; both scripts honour $FC.
          FC_BIN="$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)"
          echo "FC=$FC_BIN" >> $GITHUB_ENV
          "$FC_BIN" --version | head -1

      - name: Install toolchain (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-gcc

      - name: Build + test library (Unix)
        if: runner.os != 'Windows'
        run: |
          bash build/build-feast.sh --arch ${{ matrix.arch }}
          bash build/run-test.sh ${{ matrix.arch }}

      - name: Build + test library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash build/build-feast.sh --arch ${{ matrix.arch }}
          bash build/run-test.sh ${{ matrix.arch }}

      # ---------------------------------------------------------------- python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy scipy PySide6 pyqtgraph psutil

      - name: Expose the mingw DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # CPython from setup-python, not the MSYS2 one, so libfeast.dll's
          # dependencies (libopenblas, libgfortran) must be declared. Since 3.8
          # PATH is not consulted for dependent DLLs -- feastpy reads this.
          echo "FEAST_DLL_DIR=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $GITHUB_ENV
          echo "FC=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gfortran.exe" >> $GITHUB_ENV

      - name: feastpy binding tests
        shell: bash
        working-directory: python
        run: python -u test_feastpy.py

      - name: Headless GUI check
        shell: bash
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u verify_gui.py gui_${{ matrix.arch }}.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-${{ matrix.arch }}
          path: gui/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: libfeast-${{ matrix.arch }}
          path: 4.0/lib/${{ matrix.arch }}/

      # ------------------------------------------------------------- package
      # The bundle is self-tested in a stripped environment, because a build
      # that only runs on the machine that produced it proves nothing.
      - name: Package the desktop app
        shell: bash
        env:
          MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
        run: |
          python -m pip install pyinstaller
          bash packaging/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FEAST-app-${{ matrix.arch }}
          path: |
            dist/FEAST-${{ matrix.arch }}/
            dist/FEAST.app/
          if-no-files-found: warn

  universal:
    name: macos-universal
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: libfeast-macos-arm64, path: arm64 }
      - uses: actions/download-artifact@v4
        with: { name: libfeast-macos-x64,   path: x64 }
      - name: lipo into a universal dylib
        run: |
          mkdir -p universal
          lipo -create arm64/libfeast.dylib x64/libfeast.dylib \
               -output universal/libfeast.dylib
          lipo -info universal/libfeast.dylib
          # A green lipo does not prove two slices landed; assert it.
          lipo -info universal/libfeast.dylib | grep -q x86_64
          lipo -info universal/libfeast.dylib | grep -q arm64
      - uses: actions/upload-artifact@v4
        with:
          name: libfeast-macos-universal
          path: universal/
