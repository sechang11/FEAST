name: build-libfeast

# Builds libfeast on every platform the desktop app ships on, then runs the
# Python binding tests and the headless GUI check against it.
#
# The library building is not the interesting part -- a green .dylib does not
# prove the ctypes layer can find and load it, and that is exactly where the
# platform-specific bugs live (AMD64 vs x86_64 arch tags, DLL search paths,
# process spawning, stdio inheritance).
#
# macOS needs two runners: macos-14 is Apple Silicon, macos-15-intel is Intel.
# NOT macos-13 -- that image was retired and jobs asking for it queue forever
# instead of failing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: linux-x64
          - name: macos-arm64
            os: macos-14
            arch: macos-arm64
          - name: macos-x64
            os: macos-15-intel
            arch: macos-x64
          - name: windows-x64
            os: windows-latest
            arch: windows-x64

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- native
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev libopenmpi-dev openmpi-bin
          # Qt needs these even with the offscreen platform plugin.
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          # OpenBLAS, not Accelerate: Accelerate's LAPACK makes FEAST's
          # non-Hermitian routines return info=-3. See build/build-feast.sh.
          brew install gcc openblas open-mpi
          # ...but not Homebrew's OpenBLAS for the numerics. Its arm64 bottle
          # is threaded with pthreads, and against FEAST -- which is compiled
          # -fopenmp, and whose banded path runs through the heavily
          # OpenMP-parallel SPIKE -- 8 of the 10 banded examples return info=-3
          # or info=2. The conda-forge build (openmp_ variant) passes all ten
          # on the same hardware, so use that for linking. Homebrew is still
          # installed above for gfortran.
          case "$(uname -m)" in
            arm64) MAMBA_SUBDIR=osx-arm64 ;;
            *)     MAMBA_SUBDIR=osx-64 ;;
          esac
          curl -Ls "micro.mamba.pm/api/micromamba/$MAMBA_SUBDIR/latest"             | tar -xvj bin/micromamba
          ./bin/micromamba create -y -p "$PWD/blasenv" -c conda-forge openblas
          echo "FEAST_BLAS_PREFIX=$PWD/blasenv" >> $GITHUB_ENV
          echo "BLAS_LIBS=-L$PWD/blasenv/lib -lopenblas" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=$PWD/blasenv/lib" >> $GITHUB_ENV
          ls "$PWD/blasenv/lib/" | grep -i openblas | head -3
          # Homebrew ships versioned binaries (gfortran-14) and no plain
          # `gfortran`; both scripts honour $FC.
          FC_BIN="$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)"
          echo "FC=$FC_BIN" >> $GITHUB_ENV
          "$FC_BIN" --version | head -1

      - name: Install toolchain (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-msmpi
            make

      # SPIKE unlocks the 20 banded routines. It is fetched from
      # spike-solver.org, whose only working URL is undocumented, so a failure
      # here is non-fatal: the build carries on without banded rather than
      # going red because someone else's web server had a bad day.
      - name: Build SPIKE (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: bash build/build-spike.sh --arch ${{ matrix.arch }}

      - name: Build SPIKE (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: bash build/build-spike.sh --arch ${{ matrix.arch }}

      - name: Build + test library (Unix)
        if: runner.os != 'Windows'
        run: |
          # if/fi, not `[ -f ] && VAR=...`: steps run under `bash -e`, so a
          # false test as the last command of a line aborts the whole step.
          SPIKE=""
          if [ -f 4.0/lib/${{ matrix.arch }}/libspike.a ]; then
            SPIKE="--spike"
          fi
          bash build/build-feast.sh --arch ${{ matrix.arch }} $SPIKE
          bash build/run-test.sh ${{ matrix.arch }}

      - name: Build + test library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # if/fi, not `[ -f ] && VAR=...`: steps run under `bash -e`, so a
          # false test as the last command of a line aborts the whole step.
          SPIKE=""
          if [ -f 4.0/lib/${{ matrix.arch }}/libspike.a ]; then
            SPIKE="--spike"
          fi
          bash build/build-feast.sh --arch ${{ matrix.arch }} $SPIKE
          bash build/run-test.sh ${{ matrix.arch }}

      # Upstream's own 36 programs, banded included when SPIKE built.
      - name: Run FEAST's own examples (Unix)
        if: runner.os != 'Windows'
        run: bash tools/run_examples.sh ${{ matrix.arch }} || true

      - name: Run FEAST's own examples (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash tools/run_examples.sh ${{ matrix.arch }} || true

      # PFEAST: the same solver with -DMPI plus the distributed interfaces.
      # Built on every platform. The example run is informational rather than
      # gating: the runners have 2-4 cores and the L1L2L3 examples want 8
      # oversubscribed ranks, so timeouts there are a property of the runner,
      # not the library. The authoritative numbers are the measured runs in
      # COMPATIBILITY.md (40/44 on Windows and Apple Silicon, nothing skipped).
      - name: Build PFEAST (Unix)
        if: runner.os != 'Windows'
        run: bash build/build-pfeast.sh --arch ${{ matrix.arch }}

      - name: Build PFEAST (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash build/build-pfeast.sh --arch ${{ matrix.arch }}             --mpifc gfortran --mpi-inc /mingw64/include

      - name: Run PFEAST examples (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: RUN_TIMEOUT=420 bash tools/run_pfeast_examples.sh ${{ matrix.arch }} 2 || true

      # The Developer Kit: libfeast+libspike+libpfeast, headers, all 80
      # upstream examples, runners and build scripts with the shims. Built
      # here because this is the machine where the file permissions are real.
      # On Windows this runs in git-bash, not msys2, so powershell is on PATH
      # for the zip step.
      - name: Build the Developer Kit
        shell: bash
        run: bash packaging/build-devkit.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: FEAST-devkit-${{ matrix.arch }}
          path: |
            FEAST-devkit-${{ matrix.arch }}.tar.gz
            FEAST-devkit-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

      # ---------------------------------------------------------------- python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip numpy scipy PySide6 pyqtgraph psutil
          # cryptography belongs to the licensing layer, which is inert until a
          # signing key is configured, and the package already runs without it.
          # It has no wheel for every platform/Python pair -- macOS-Intel with
          # 3.12 builds it from source through Rust -- so a crates.io outage
          # must not fail the build of an eigensolver. Best effort.
          python -m pip install cryptography             || echo "cryptography unavailable; the licensing layer stays inert" 

      - name: Expose the mingw DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # CPython from setup-python, not the MSYS2 one, so libfeast.dll's
          # dependencies (libopenblas, libgfortran) must be declared. Since 3.8
          # PATH is not consulted for dependent DLLs -- feastpy reads this.
          echo "FEAST_DLL_DIR=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $GITHUB_ENV
          echo "FC=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gfortran.exe" >> $GITHUB_ENV

      # FEAST's C headers are hand-maintained and nothing upstream checks them
      # against the Fortran. Four already disagree in argument count, which
      # corrupts memory for a C caller; this fails only on a NEW one.
      - name: C headers match the Fortran
        shell: bash
        run: python tools/check_headers.py

      - name: feastpy binding tests
        shell: bash
        working-directory: python
        run: python -u test_feastpy.py

      - name: Headless GUI check
        shell: bash
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u verify_gui.py gui_${{ matrix.arch }}.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots-${{ matrix.arch }}
          path: gui/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: libfeast-${{ matrix.arch }}
          path: 4.0/lib/${{ matrix.arch }}/

      # ------------------------------------------------------------- package
      # The bundle is self-tested in a stripped environment, because a build
      # that only runs on the machine that produced it proves nothing.
      - name: Package the desktop app
        shell: bash
        env:
          MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
        run: |
          python -m pip install pyinstaller
          bash packaging/build-app.sh

      # PyInstaller emits both a plain folder and, on macOS, a .app wrapped
      # around a second copy of it. Uploading both doubled the macOS artifact
      # to 1.4 GB of the same program twice. Ship the .app on macOS -- it is
      # the double-clickable one -- and the folder everywhere else.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: FEAST-app-${{ matrix.arch }}
          path: dist/FEAST.app/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: FEAST-app-${{ matrix.arch }}
          path: dist/FEAST-${{ matrix.arch }}/
          if-no-files-found: warn

      # A single archive per platform, ready to hand to a user -- built HERE,
      # on the machine that produced the binaries, because that is the only
      # place the file permissions are real. A GitHub artifact is itself a zip
      # and does not carry the executable bit, so an archive repacked from a
      # downloaded artifact ships a launcher nobody can run: on Linux and macOS
      # the user gets "Permission denied" from a build that is otherwise fine.
      #
      # tar.gz on Unix (keeps the executable bit and any symlinks inside a
      # .app), zip on Windows (which has no executable bit to lose).
      - name: Build the distributable archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ -d FEAST.app ]; then
            tar czf "../FEAST-${{ matrix.arch }}.tar.gz" FEAST.app
          else
            tar czf "../FEAST-${{ matrix.arch }}.tar.gz" "FEAST-${{ matrix.arch }}"
          fi
          cd ..
          ls -lh "FEAST-${{ matrix.arch }}.tar.gz"
          # Assert the launcher is executable inside the archive; a silent
          # regression here is only discovered by the person who downloads it.
          tar tzvf "FEAST-${{ matrix.arch }}.tar.gz"             | grep -E '(MacOS/FEAST|/FEAST)$' | head -3
          tar tzvf "FEAST-${{ matrix.arch }}.tar.gz"             | grep -E '(MacOS/FEAST|/FEAST)$' | grep -q '^-rwx'             || { echo "launcher is not executable in the archive"; exit 1; }

      - name: Build the distributable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FEAST-${{ matrix.arch }}/*" `
                           -DestinationPath "FEAST-${{ matrix.arch }}.zip" `
                           -CompressionLevel Optimal
          Get-Item "FEAST-${{ matrix.arch }}.zip" |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: FEAST-dist-${{ matrix.arch }}
          path: |
            FEAST-${{ matrix.arch }}.tar.gz
            FEAST-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0        # already compressed

  # The full-feature proof: FEAST with MKL 2021.4 on macOS Intel. This is the
  # configuration in which upstream's own examples go 36/36 -- the direct
  # PARDISO solver is what the two polynomial examples need -- and, because
  # MKL 2021 predates Intel's Rosetta block, the same binaries are the route
  # to 100% of the original's features on Apple Silicon (translated).
  # continue-on-error: a red here must not gate the ordinary builds.
  macos-x64-mkl:
    name: macos-x64 + MKL (full-feature)
    runs-on: macos-15-intel
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain + MKL 2021.4
        run: |
          brew install gcc
          FC_BIN="$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)"
          echo "FC=$FC_BIN" >> $GITHUB_ENV
          curl -Ls "micro.mamba.pm/api/micromamba/osx-64/latest" | tar -xvj bin/micromamba
          ./bin/micromamba create -y -p "$PWD/mklenv" -c conda-forge "mkl=2021.4"
          ls "$PWD/mklenv/lib" | grep -c "^libmkl" | xargs echo "mkl dylibs:"

      - name: Build (SPIKE + FEAST against MKL)
        run: |
          # zdotc/cdotc ABI shim: gfortran's complex return vs intel_lp64's
          # hidden pointer. See build/mkl_gfortran_abi_compat.c.
          cc -O2 -c build/mkl_gfortran_abi_compat.c -o mkl_abi.o
          MKL="$PWD/mklenv/lib"
          # -rpath baked into every binary, NOT DYLD_LIBRARY_PATH: macOS SIP
          # strips DYLD_* across protected binaries (including /bin/bash), so
          # the variable never reliably reaches a test process -- and exported
          # through GITHUB_ENV it shadows the system libiconv for every later
          # step, which breaks git itself in job cleanup. Measured both.
          export BLAS_LIBS="$PWD/mkl_abi.o -L$MKL -Wl,-rpath,$MKL -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -lpthread -lm -ldl"
          echo "BLAS_LIBS=$BLAS_LIBS" >> $GITHUB_ENV
          bash build/build-spike.sh --arch macos-x64-mkl
          bash build/build-feast.sh --arch macos-x64-mkl --mkl --spike
          bash build/run-test.sh macos-x64-mkl

      - name: All 36 examples must pass with the direct solver
        run: |
          bash tools/run_examples.sh macos-x64-mkl | tee examples.log || true
          grep -q "passed 36, failed 0" examples.log             || { echo "expected 36/36 with MKL"; exit 1; }

      - name: Developer Kit (full-feature, MKL bundled)
        run: MKL_LIB_DIR="$PWD/mklenv/lib" bash packaging/build-devkit.sh macos-x64-mkl

      - uses: actions/upload-artifact@v4
        with:
          name: FEAST-devkit-macos-x64-mkl
          path: FEAST-devkit-macos-x64-mkl.tar.gz
          if-no-files-found: error
          compression-level: 0

  universal:
    name: macos-universal
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: libfeast-macos-arm64, path: arm64 }
      - uses: actions/download-artifact@v4
        with: { name: libfeast-macos-x64,   path: x64 }
      - name: lipo into a universal dylib
        run: |
          mkdir -p universal
          lipo -create arm64/libfeast.dylib x64/libfeast.dylib \
               -output universal/libfeast.dylib
          lipo -info universal/libfeast.dylib
          # A green lipo does not prove two slices landed; assert it.
          lipo -info universal/libfeast.dylib | grep -q x86_64
          lipo -info universal/libfeast.dylib | grep -q arm64
      - uses: actions/upload-artifact@v4
        with:
          name: libfeast-macos-universal
          path: universal/
